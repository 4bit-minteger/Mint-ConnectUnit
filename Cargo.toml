[package]
name = "mint"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
autobins = false
default-run = "ConnectUnit"

[[bin]]
name = "ConnectUnit"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "time", "sync", "io-util", "io-std"] }
socket2 = "0.5"
aegis = { version = "0.9.15", default-features = false, features = ["pure-rust", "std"] }
hkdf = "0.12"
blake2 = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bincode = "1"
arc-swap = "1"
parking_lot = "0.12"
bytes = "1"
smallvec = "1"
anyhow = "1"
thiserror = "1"
indexmap = "2"
reed-solomon-erasure = "6"
mimalloc = { version = "0.1", default-features = false }
[build-dependencies]
winres = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
wintun = "0.4"
windows = { version = "0.58", features = [
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_Foundation",
  "Win32_Networking_WinSock",
] }

[profile.release]
opt-level = 3
panic = 'abort'
overflow-checks = false
strip = true
debug = false
lto = "fat"
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
